# Generated from mkdocs.yml by mkdocs-to-zensical.py; the why of every block is in
# new-repo/templates/zensical.toml. Edit this file, not mkdocs.yml, which is gone.

[project]
site_name = "duplicacy-exporter"
site_url = "https://geiserx.github.io/duplicacy-exporter/"
site_description = "Prometheus exporter for Duplicacy backups: live progress and speed while a backup runs, and the summary when it ends, for Grafana and alerts."
repo_url = "https://github.com/GeiserX/duplicacy-exporter"
repo_name = "GeiserX/duplicacy-exporter"
edit_uri = "edit/main/docs/"
strict = true
extra_css = ["stylesheets/theme.css"]
exclude_docs = """
[A-Z]*.md
design/
research/
notes/
requirements-docs.txt
"""
nav = [
  { Home = "index.md" },
  { "Get started" = [
      { "Getting started" = "getting-started.md" },
      { Usage = "usage.md" },
      { "Prometheus and Grafana" = "prometheus-grafana.md" },
    ] },
  { Reference = [
      { Configuration = "configuration.md" },
      { Metrics = "metrics.md" },
      { "Webhook payload" = "webhook.md" },
      { "Storage poller" = "storage-poller.md" },
    ] },
  { Help = [
      { "How it works" = "how-it-works.md" },
      { Troubleshooting = "troubleshooting.md" },
      { "Related projects" = "related.md" },
    ] },
  { Development = "development.md" },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
language = "en"
variant = "modern"
logo = "images/logo.svg"
favicon = "images/icon.svg"
font = false
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "content.code.copy",
  "content.action.edit",
  "search.highlight",
  "toc.follow",
  "navigation.instant",
  "navigation.instant.progress",
  "content.action.copy",
]
icon.repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/GeiserX/duplicacy-exporter"

[[project.extra.social]]
icon = "fontawesome/brands/docker"
link = "https://hub.docker.com/r/drumsergio/duplicacy-exporter"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/duplicacy-exporter/"

[project.plugins.search]

[project.plugins.redirects.redirect_maps]
"installation.md" = "getting-started.md"
"architecture.md" = "how-it-works.md"

[project.plugins.llmstxt.sections]
Documentation = ["*.md", "*/*.md"]

[project.markdown_extensions]
admonition = {}
"pymdownx.details" = {}
"pymdownx.superfences".custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
"pymdownx.tabbed".alternate_style = true
"pymdownx.highlight".anchor_linenums = true
"pymdownx.inlinehilite" = {}
"pymdownx.snippets".base_path = [".", "docs"]
"pymdownx.snippets".check_paths = true
"pymdownx.mark" = {}
attr_list = {}
md_in_html = {}
"pymdownx.emoji".emoji_index = "zensical.extensions.emoji.twemoji"
"pymdownx.emoji".emoji_generator = "zensical.extensions.emoji.to_svg"
tables = {}
toc.permalink = true
