<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 106 108" width="106" height="108" role="img" aria-label="duplicacy-exporter">
  <!--
    Header logo: four level-meter columns from banner.svg, same 22x12 cells on a
    28x16 pitch, same colours (green base, amber middle, red peak). No plate and
    no unlit cells, so it sits directly on the dark header bar.
  -->
  <g fill="#3BB273">
    <rect x="0"  y="96" width="22" height="12"/><rect x="0"  y="80" width="22" height="12"/><rect x="0"  y="64" width="22" height="12"/>
    <rect x="28" y="96" width="22" height="12"/><rect x="28" y="80" width="22" height="12"/><rect x="28" y="64" width="22" height="12"/>
    <rect x="56" y="96" width="22" height="12"/><rect x="56" y="80" width="22" height="12"/><rect x="56" y="64" width="22" height="12"/>
    <rect x="84" y="96" width="22" height="12"/><rect x="84" y="80" width="22" height="12"/><rect x="84" y="64" width="22" height="12"/>
  </g>
  <g fill="#FFB547">
    <rect x="0"  y="48" width="22" height="12"/>
    <rect x="28" y="48" width="22" height="12"/><rect x="28" y="32" width="22" height="12"/>
    <rect x="56" y="48" width="22" height="12"/><rect x="56" y="32" width="22" height="12"/><rect x="56" y="16" width="22" height="12"/>
    <rect x="84" y="48" width="22" height="12"/><rect x="84" y="32" width="22" height="12"/>
  </g>
  <g fill="#E6522C">
    <rect x="28" y="16" width="22" height="12"/>
    <rect x="56" y="0"  width="22" height="12"/>
  </g>
</svg>
