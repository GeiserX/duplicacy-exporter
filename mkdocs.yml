site_name: duplicacy-exporter
site_url: https://geiserx.github.io/duplicacy-exporter/
site_description: "Prometheus exporter for Duplicacy backups: live progress and speed while a backup runs, and the summary when it ends, for Grafana and alerts."
repo_url: https://github.com/GeiserX/duplicacy-exporter
repo_name: GeiserX/duplicacy-exporter
edit_uri: edit/main/docs/

# A warning is a broken link, a missing page or a page nobody can reach. All of
# them fail the build, locally and in CI.
strict: true

theme:
  name: material
  language: en
  logo: images/logo.svg
  favicon: images/icon.svg
  # Dark first: the first palette entry is the default, and the banner is dark.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# MkDocs reports most link problems as `info`, which --strict ignores. Each
# line promotes one of them to a warning so the build fails on it.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search
  # Old page URLs keep working after a rename.
  - redirects:
      redirect_maps:
        installation.md: getting-started.md
        architecture.md: how-it-works.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # base_path includes the repository root, so a page can include a file that
  # ships (docker-compose.yml) word for word. check_paths makes a missing
  # include fail the build instead of rendering an empty block.
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.mark
  - attr_list
  - md_in_html
  # Renders :material-xxx: shortcodes as icons. The grid cards on index.md use
  # them; without this they print as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GeiserX/duplicacy-exporter
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/drumsergio/duplicacy-exporter
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/duplicacy-exporter/

extra_css:
  - stylesheets/theme.css

# Files under docs/ that are not pages. MkDocs publishes every Markdown file in
# docs/ whether or not it is in the nav, so anything that is not a page is
# listed here.
exclude_docs: |
  [A-Z]*.md
  design/
  research/
  notes/
  requirements-docs.txt

nav:
  - Home: index.md
  - Get started:
      - Getting started: getting-started.md
      - Usage: usage.md
      - Prometheus and Grafana: prometheus-grafana.md
  - Reference:
      - Configuration: configuration.md
      - Metrics: metrics.md
      - Webhook payload: webhook.md
      - Storage poller: storage-poller.md
  - Help:
      - How it works: how-it-works.md
      - Troubleshooting: troubleshooting.md
      - Related projects: related.md
  - Development: development.md
